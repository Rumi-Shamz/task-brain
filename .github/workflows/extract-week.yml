# Manual weekly extraction — API key stays in Actions secrets (never in client JS).
# Reads the transcript and data.json from the private task-brain-data repo, writes
# week-YYYY-WNN.json + prebrief-YYYY-WNN.md, and optionally commits them back there.
#
# Inputs are passed to the shell only through env vars and validated before use,
# so transcript text can never run as a command.
name: Extract week plan

on:
  workflow_dispatch:
    inputs:
      week:
        description: 'ISO week, e.g. 2026-W41 (empty = current week)'
        required: false
        type: string
      transcript_path:
        description: 'Transcript file in task-brain-data (empty = transcripts/week-<week>.txt)'
        required: false
        type: string
      transcript:
        description: 'Or paste a short transcript here (used when no file is found)'
        required: false
        type: string
      prebrief_only:
        description: 'Only build the prebrief (no model call)'
        required: false
        type: boolean
        default: false
      push_to_data_repo:
        description: 'Commit outputs to the private task-brain-data repo'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    env:
      DATA_REPO: Rumi-Shamz/task-brain-data
      WEEK_INPUT: ${{ inputs.week }}
      TRANSCRIPT_PATH_INPUT: ${{ inputs.transcript_path }}
      TRANSCRIPT_TEXT: ${{ inputs.transcript }}
      PREBRIEF_ONLY: ${{ inputs.prebrief_only }}
      PUSH_REQUESTED: ${{ inputs.push_to_data_repo }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve week
        run: |
          set -euo pipefail
          week="${WEEK_INPUT:-$(date -u +%G-W%V)}"
          if ! [[ "$week" =~ ^[0-9]{4}-W[0-9]{2}$ ]]; then
            echo "week must look like 2026-W41"; exit 1
          fi
          echo "WEEK=$week" >> "$GITHUB_ENV"

      - name: Fetch private data repo
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          set -euo pipefail
          # Fail now, before a paid model call, if the results could not be pushed afterwards.
          if [ "$PUSH_REQUESTED" = "true" ] && [ -z "${DATA_REPO_TOKEN:-}" ]; then
            echo "push_to_data_repo needs the DATA_REPO_TOKEN secret"; exit 1
          fi
          if [ -z "${DATA_REPO_TOKEN:-}" ]; then
            echo "DATA_REPO_TOKEN secret missing — running without data.json"; mkdir -p /tmp/data-repo; exit 0
          fi
          git clone --depth 1 "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" /tmp/data-repo

      - name: Pick transcript
        run: |
          set -euo pipefail
          rel="${TRANSCRIPT_PATH_INPUT:-transcripts/week-${WEEK}.txt}"
          case "$rel" in /*|*..*) echo "transcript_path must stay inside the data repo"; exit 1 ;; esac
          if [ -f "/tmp/data-repo/$rel" ]; then
            cp "/tmp/data-repo/$rel" /tmp/transcript.txt
          elif [ -n "${TRANSCRIPT_TEXT:-}" ]; then
            printf '%s\n' "$TRANSCRIPT_TEXT" > /tmp/transcript.txt
          elif [ "$PREBRIEF_ONLY" != "true" ]; then
            echo "No transcript: add $rel to the data repo or paste one"; exit 1
          fi

      - name: Run extract_week.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          args=(--week "$WEEK" --out /tmp/week-out)
          [ -f /tmp/data-repo/data.json ] && args+=(--data /tmp/data-repo/data.json)
          if [ "$PREBRIEF_ONLY" = "true" ]; then
            node scripts/extract_week.mjs --prebrief-only "${args[@]}"
          else
            node scripts/extract_week.mjs /tmp/transcript.txt "${args[@]}"
          fi
          ls -la /tmp/week-out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: week-extract-${{ env.WEEK }}
          path: /tmp/week-out/*

      - name: Push to private data repo
        if: ${{ inputs.push_to_data_repo }}
        run: |
          set -euo pipefail
          [ -d /tmp/data-repo/.git ] || { echo "DATA_REPO_TOKEN secret missing"; exit 1; }
          mkdir -p /tmp/data-repo/weeks
          cp /tmp/week-out/* /tmp/data-repo/weeks/
          cd /tmp/data-repo
          git config user.name "task-brain-bot"
          git config user.email "bot@users.noreply.github.com"
          git add weeks/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Weekly extract ${WEEK}"
          # Another write (e.g. the app syncing data.json) may land between clone and push.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push rejected (attempt $attempt) — rebasing on the remote and retrying"
            git pull --rebase
          done
          echo "could not push after 3 attempts"; exit 1
